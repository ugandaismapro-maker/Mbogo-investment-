name: Build Mbogo APK
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -1)
          echo "Found $ZIP"
          unzip -o "$ZIP" -d .
          rm -f "$ZIP"
          ls -la
      - name: Find gradlew
        run: |
          find . -name "gradlew" -type f
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -1)
          echo "GRADLEW=$GRADLEW_PATH" >> $GITHUB_ENV
          echo "Found: $GRADLEW_PATH"
          ls -la $(dirname $GRADLEW_PATH)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          echo "Using $GRADLEW_PATH"
          chmod +x $GRADLEW_PATH
          cd $(dirname $GRADLEW_PATH)
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mbogo-APK
          path: '**/*.apk'
