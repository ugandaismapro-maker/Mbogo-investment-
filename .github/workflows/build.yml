name: Build Mbogo APK
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o Mbogo_Investment_Android_Starter.zip -d . || unzip -o Mbogo_Investment_An*.zip -d .
          ls -la
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          find . -name gradlew -exec chmod +x {} \;
          GRADLE=$(find . -name gradlew | head -1)
          DIR=$(dirname $GRADLE)
          cd $DIR && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mbogo-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
