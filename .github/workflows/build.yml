name: Build Mbogo APK
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List files
        run: ls -la
      - name: Unzip
        run: |
          ZIP=$(ls *.zip | head -1)
          echo "Found $ZIP"
          unzip -o "$ZIP" -d project
          ls -la project
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          cd project
          if [ -d "Mbogo_Investment_Android_Starter" ]; then cd Mbogo_Investment_Android_Starter; fi
          ls -la
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mbogo-APK
          path: '**/*.apk'
